<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LWDT — a lightweight device-tree and driver framework for ESP-IDF, inspired by Zephyr RTOS. 通过板级 Jsonnet 描述、构建期 C 宏生成和 drvfx 初始化管理 ESP32 硬件配置。"
    />
    <meta name="theme-color" content="#f2ece1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>LWDT — Lightweight Device Tree & Driver Framework for ESP-IDF</title>
    <script>
      (function () {
        try {
          var m = localStorage.getItem("lwdt-theme") || "system";
          var d =
            m === "dark" ||
            (m !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
